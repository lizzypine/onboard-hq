name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: onboard_hq_test_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/onboard_hq_test_ci?sslmode=disable
      PG18_BIN: /usr/lib/postgresql/18/bin
      PLAYWRIGHT_BROWSERS_PATH: .superpowers/browsers
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - run: npm ci --ignore-scripts
      - name: Install PostgreSQL 18 tools for isolated runner tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-18
      - run: uv sync --locked --dev
      - run: bash scripts/install-dbmate.sh
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      - name: Verify database deliverables on the test service
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DBMATE_NO_DUMP_SCHEMA: "true"
        run: |
          uv run python -m db.seed
          npx dbmate status --exit-code
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-traces
          path: test-results/
          if-no-files-found: ignore
